            --neon-1: #00eaff;
            --neon-2: #b400ff;
            --neon-3: #00ff88;
        }
        
        body { 
            margin: 0;

            left: 0; 
            width: 100%; 
            height: 100%; 
            pointer-events: none; 
        }

        #effect { z-index: 2; }
        #waveCanvas { 
            height: 140px; 
            top: auto;

            z-index: 1;

        #vietnamFlagCanvas {
            position: fixed;
            top: 40px;

            box-shadow: 0 0 15px rgba(238, 28, 37, 0.8), 0 0 30px rgba(255, 255, 0, 0.4);

        }
        @keyframes flagCanvasGlow {
            0% { box-shadow: 0 0 15px rgba(238, 28, 37, 0.8), 0 0 30px rgba(255, 255, 0, 0.4); }
            50% { box-shadow: 0 0 25px rgba(255, 100, 100, 1), 0 0 40px rgba(255, 255, 100, 0.7); }
            100% { box-shadow: 0 0 15px rgba(238, 28, 37, 0.8), 0 0 30px rgba(255, 255, 0, 0.4); }

        .view-counter { 
            position: fixed; 
            top: 20px; 
            right: 20px;

            text-align: right; 
            font-size: 12px; 
            color: rgba(255, 255, 255, 0.5); 
        }

        .fps-counter { 
            position: fixed; 
            top: 90px; 
            right: 20px; 
            font-size: 26px; 
            font-weight: bold; 
            color: red; 
            z-index: 9997; 
            text-shadow: 0 0 3px rgba(255,255,255,0.5); 
        }
        
        #introScreen {

    <script>
        const canvasL = document.getElementById("lightning");
        const ctxL = canvasL.getContext("2d");
        function sizeL() { canvasL.width = innerWidth; canvasL.height = innerHeight; }
        sizeL(); window.onresize = sizeL;
        function rand(min, max) { return Math.random() * (max - min) + min; }
        function createBolt() {
            let x = rand(canvasL.width * 0.2, canvasL.width * 0.8);
            let segments = []; let count = rand(15, 30);
            for (let i = 0; i < count; i++) segments.push({ x: x + rand(-40, 40), y: (i / count) * canvasL.height });
            return segments;
        }
        let bolts = [];
        setInterval(() => { bolts.push(createBolt()); setTimeout(() => bolts.shift(), 200); }, 250);
        function drawL() {
            ctxL.clearRect(0, 0, canvasL.width, canvasL.height);
            ctxL.lineWidth = 2; ctxL.strokeStyle = "rgba(0, 170, 255, 1)";
            ctxL.shadowBlur = 25; ctxL.shadowColor = "cyan";
            bolts.forEach(bolt => {
                ctxL.beginPath();
                for (let i = 0; i < bolt.length - 1; i++) { ctxL.moveTo(bolt[i].x, bolt[i].y); ctxL.lineTo(bolt[i + 1].x, bolt[i + 1].y); }
                ctxL.stroke();
            });
            requestAnimationFrame(drawL);
        }
        drawL();

        function updateFPS() {
            let fpsElement = document.querySelector("#fpsCounter .fps-value");
            let lastFrameTime = performance.now(); let frameCount = 0;
            function refreshFPS() {
                let now = performance.now(); frameCount++;
                if (now - lastFrameTime >= 1000) {
                    let fps = Math.round(frameCount / ((now - lastFrameTime) / 1000));
                    fpsElement.textContent = `${fps} FPS`;
                    lastFrameTime = now; frameCount = 0;
                }
                requestAnimationFrame(refreshFPS);
            }
            refreshFPS();
        }
        document.addEventListener("DOMContentLoaded", updateFPS);

        const flagCanvas = document.getElementById('vietnamFlagCanvas');
        const flagCtx = flagCanvas.getContext('2d');
        const flagW = flagCanvas.width;
        const flagH = flagCanvas.height;
        const flagAmp = 5;
        const flagSpeed = 0.05;
        let flagTime = 0;

        function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;

            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
        }

        function drawFlag() {
            flagCtx.clearRect(0, 0, flagW, flagH);

            flagCtx.fillStyle = '#ee1c25'; 
            flagCtx.fillRect(0, 0, flagW, flagH);

            flagCtx.fillStyle = '#ffff00';
            
            flagCtx.save();
            flagCtx.translate(flagW / 2, flagH / 2);
            
            const waveX = Math.sin(flagTime * flagSpeed) * flagAmp * 1.5; 
            const waveY = Math.cos(flagTime * flagSpeed * 0.7) * flagAmp;

            flagCtx.transform(
                1, 
                0.005, 
                0.005, 
                1, 
                waveX, 
                waveY 
            );
            
            drawStar(flagCtx, 0, 0, 5, flagH * 0.35, flagH * 0.15);
            flagCtx.fill();
            flagCtx.restore();

            flagTime++;
            requestAnimationFrame(drawFlag);
        }
        drawFlag();


        (async function init(){
            const intro = document.getElementById("introScreen");
            const musicPlayer = document.getElementById("musicPlayer");
            const avatarBox = document.getElementById("avatarBox");
            
            const avatarList = ["avatar.jpg", "avatar.png", "image.jpg"];
            const musicList = ["music.mp3", "song.mp3"];
            
            intro.addEventListener("click", async () => {
                intro.style.opacity = "0";
                setTimeout(() => { if (intro) intro.remove(); }, 420);
                try { 
                    if (audioCtx && audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }
                    await musicPlayer.play(); 
                    initVisualizer(); 
                } catch(e){ console.log('Chưa phát nhạc được:', e); }
            });

            async function loadAvatar(){
                for (let file of avatarList) {
                    let img = new Image(); img.src = file;
                    avatarBox.style.backgroundImage = `url('${file}')`; 
                    break; 
                }
            }
            loadAvatar();

            if(musicList.length > 0) musicPlayer.src = musicList[0];

            const cvs = document.getElementById("effect"), c = cvs.getContext("2d");
            function resizeCanvas(){ cvs.width = innerWidth; cvs.height = innerHeight; }
            window.addEventListener('resize', resizeCanvas); resizeCanvas();
            const icons = ["🍀", "💖", "❤️", "💚", "💗"];
            const drops = Array.from({length: 50}, () => ({
                x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight,
                size: Math.random() * 20 + 10, speed: Math.random() * 2 + 1,
                char: icons[Math.floor(Math.random() * icons.length)]
            }));

            function drawRain() {
                c.clearRect(0, 0, cvs.width, cvs.height);
                drops.forEach(s => {
                    c.font = s.size + "px Arial"; c.fillText(s.char, s.x, s.y);
                    s.y += s.speed;
                    if (s.y > cvs.height) s.y = -20;
                });
                requestAnimationFrame(drawRain);
            }
            drawRain();

            let audioCtx, analyser, dataArray, source;
            const waveCanvas = document.getElementById('waveCanvas');
            const wctx = waveCanvas.getContext('2d');
            
            function resizeWaveCanvas() {
                waveCanvas.width = window.innerWidth; 
                waveCanvas.height = 140; 
            }
            window.addEventListener('resize', resizeWaveCanvas);
            resizeWaveCanvas();

            function initVisualizer(){
                if(audioCtx) return;
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    source = audioCtx.createMediaElementSource(musicPlayer);
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 256;
                    source.connect(analyser);
                    analyser.connect(audioCtx.destination);
                    dataArray = new Uint8Array(analyser.frequencyBinCount);
                    drawWave();
                } catch (e) {
                    console.error("Lỗi khởi tạo AudioContext:", e);
                }
            }

            function drawWave(){
                requestAnimationFrame(drawWave);
                if (!analyser || !dataArray) return;
                
                analyser.getByteFrequencyData(dataArray);
                wctx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
                
                const bufferLength = analyser.frequencyBinCount;
                const barWidth = (waveCanvas.width / bufferLength) * 1.5; 
                let barHeight;
                let x = 0;

                for(let i = 0; i < bufferLength; i++) {
                    barHeight = dataArray[i] / 2;
                    wctx.fillStyle = `rgb(${barHeight+50}, 50, 200)`;
                    wctx.fillRect(x, waveCanvas.height - barHeight, barWidth, barHeight);
                    x += barWidth + 1;
                }
            }

        })();
    </script>

</body>
</html>
